rules:
  - id: ift3913-hardcoded-password
    languages:
      - java
    severity: ERROR
    message: "Mot de passe codé en dur détecté."
    patterns:
      - pattern: |
          private static final String $NAME = $VALUE;
      - metavariable-regex:
          metavariable: $NAME
          regex: '(?i).*PASSWORD.*'
      - metavariable-regex:
          metavariable: $VALUE
          regex: '".+"'
