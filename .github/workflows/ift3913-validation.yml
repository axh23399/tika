
name: IFT3913 - Validation Tika

on:
  push:
    branches:
      - tache3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilation:
    name: Compilation Java
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compiler Tika Core
        run: mvn -B -pl tika-core -am -DskipTests -Dcheckstyle.skip compile

  semgrep:
    name: Detection des 7 vulnerabilites
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer Semgrep
        run: python -m pip install semgrep==1.184.0

      - name: Verifier les fichiers de configuration
        run: |
          ls -la .semgrep/

          for fichier in \
            hardcoded-password.yml \
            insecure-token.yml \
            insecure-tls.yml \
            path-traversal.yml
          do
            if [ ! -f ".semgrep/$fichier" ]; then
              echo "ERREUR : fichier manquant : $fichier"
              exit 1
            fi
          done

      - name: Analyser Tika avec Semgrep
        run: |
          semgrep scan --verbose \
            --config auto \
            --config .semgrep/hardcoded-password.yml \
            --config .semgrep/insecure-token.yml \
            --config .semgrep/insecure-tls.yml \
            --config .semgrep/path-traversal.yml \
            --json \
            --output semgrep-results.json \
            tika-core

      - name: Verifier les 7 vulnerabilites
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          with open("semgrep-results.json") as f:
              data = json.load(f)

          expected = {
              "InsecurePasswordVerifier.java": "use-of-md5",
              "InsecureCredentials.java": "ift3913-hardcoded-password",
              "InsecureTokenGenerator.java": "ift3913-insecure-session-token",
              "InsecureTlsVerifier.java": "ift3913-insecure-tls",
              "InsecureDeserializer.java": "object-deserialization",
              "InsecureFileReader.java": "ift3913-path-traversal",
              "InsecureSqlQuery.java": "jdbc-sqli",
          }

          results = data["results"]
          errors = data.get("errors", [])
          missing = []

          print("Alertes detectees :", len(results))
          print("Erreurs Semgrep :", len(errors))

          for filename, rule in expected.items():
              found = any(
                  Path(r["path"]).name == filename
                  and r["check_id"].endswith(rule)
                  for r in results
              )

              print(("PASS" if found else "FAIL"), filename)

              if not found:
                  missing.append(filename)

          if errors or missing:
              raise SystemExit("ECHEC : verification incomplete")

          print("SUCCES : 7 types de vulnerabilites detectes")
          PY

      - name: Conserver le rapport Semgrep
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-semgrep-tika
          path: semgrep-results.json
          if-no-files-found: ignore
